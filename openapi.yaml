openapi: 3.0.3
info:
  title: Dawith Welfare Office Local API
  version: 0.2.9
  description: Local-only API used by the Dawith browser workspace and Electron app.
servers:
  - url: http://127.0.0.1:4387
    description: Institution device only
paths:
  /api/health:
    get:
      summary: Check the local boundary
      responses:
        '200':
          description: Local-only status
  /api/capabilities:
    get:
      summary: Detect local engines and storage
      responses:
        '200':
          description: Capability map
  /api/cases:
    get:
      summary: List encrypted local cases
      responses:
        '200': { description: Local case list }
    post:
      summary: Create a local case label
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 160 }
      responses:
        '201': { description: Created local case }
  /api/audit:
    get:
      summary: Read local metadata-only audit events
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Audit events contain no record content }
  /api/process:
    post:
      summary: Create a counseling, meeting, or audio draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRequest'
      responses:
        '200':
          description: Draft generated locally
        '400':
          description: Invalid input or blocked external provider
  /api/records:
    get:
      summary: Search local records
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string, enum: [counseling, meeting, audio] }
      responses:
        '200':
          description: Local record list
    post:
      summary: Save a reviewed record to encrypted SQLite
      responses:
        '201':
          description: Saved record
  /api/records/{id}:
    get:
      summary: Open one local record
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      responses:
        '200': { description: Record detail }
        '404': { description: Record not found }
    patch:
      summary: Update a reviewed local record
      parameters: [{ $ref: '#/components/parameters/RecordId' }]
      responses:
        '200': { description: Updated record }
  /api/records/{id}/export:
    get:
      summary: Export a local record
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - in: query
          name: format
          schema: { type: string, enum: [json, markdown, html] }
      responses:
        '200': { description: Local file content }
  /api/document-templates:
    get:
      summary: List institution document templates
      responses:
        '200': { description: Built-in and locally uploaded institution templates }
    post:
      summary: Analyze and save a DOCX or HWPX template locally
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentTemplateUploadRequest'
      responses:
        '201': { description: Template metadata and detected fields }
        '400': { description: Unsupported format, size, or invalid archive }
  /api/document-templates/{id}:
    get:
      summary: Read one locally uploaded template
      parameters: [{ $ref: '#/components/parameters/DocumentTemplateId' }]
      responses:
        '200': { description: Template metadata and detected fields }
        '404': { description: Template not found }
  /api/document-templates/{id}/render:
    post:
      summary: Fill a locally stored template without external processing
      parameters: [{ $ref: '#/components/parameters/DocumentTemplateId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields: { type: object, additionalProperties: { type: string } }
      responses:
        '200': { description: Filled DOCX or HWPX binary }
        '404': { description: Template not found }
  /api/documents/preview:
    post:
      summary: Build a reviewed document draft without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentPreviewRequest'
      responses:
        '200': { description: Local document draft }
        '400': { description: Invalid template }
  /api/documents:
    get:
      summary: List encrypted local documents
      responses:
        '200': { description: Local document list }
    post:
      summary: Save a reviewed document draft to encrypted SQLite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentSaveRequest'
      responses:
        '201': { description: Saved local document }
  /api/documents/{id}:
    get:
      summary: Open one local document
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      responses:
        '200': { description: Local document detail }
        '404': { description: Document not found }
    patch:
      summary: Update a reviewed local document
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      responses:
        '200': { description: Updated local document }
  /api/documents/{id}/export:
    get:
      summary: Export a local document
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - in: query
          name: format
          schema: { type: string, enum: [docx, markdown, html, pdf] }
      responses:
        '200': { description: DOCX, Markdown, or print-ready HTML content }
  /api/transcribe:
    post:
      summary: Transcribe with an institution-approved local whisper.cpp model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, dataBase64]
              properties:
                fileName: { type: string, description: WAV, MP3, M4A, OGG, FLAC, AAC, or WEBM }
                dataBase64: { type: string, description: Base64 audio bytes, maximum raw size 50 MB }
      responses:
        '200': { description: Local transcript with segments and SHA-256 source hash }
        '409': { description: Whisper model is not configured }
        '400': { description: Invalid size or unsupported audio format }
  /api/settings:
    get:
      summary: Read local settings
      responses:
        '200': { description: Local settings }
    patch:
      summary: Update local settings
      responses:
        '200': { description: Updated settings }
components:
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string }
    DocumentTemplateId:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    ProcessRequest:
      type: object
      required: [kind, rawText]
      properties:
        kind: { type: string, enum: [counseling, meeting, audio] }
        provider: { type: string, enum: [rules, ollama-local] }
        model: { type: string }
        caseId: { type: string }
        rawText: { type: string }
        contextText: { type: string }
    DocumentPreviewRequest:
      type: object
      required: [templateId]
      properties:
        templateId: { type: string, description: Built-in ID or uploaded:<id> }
        fields: { type: object, additionalProperties: { type: string } }
        source: { type: object, additionalProperties: true }
    DocumentSaveRequest:
      type: object
      required: [templateId, payload]
      properties:
        templateId: { type: string, description: Built-in ID or uploaded:<id> }
        title: { type: string }
        payload: { type: object, additionalProperties: true }
    DocumentTemplateUploadRequest:
      type: object
      required: [fileName, dataBase64]
      properties:
        fileName: { type: string, description: DOCX or HWPX file name }
        dataBase64: { type: string, description: Base64-encoded local template, maximum raw size 25 MB }
