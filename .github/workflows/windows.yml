name: Build Dawith Welfare Office for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Browser regression test
        run: npm run test:e2e
      - name: Build Windows installers
        run: npm run dist:win
      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $app = Join-Path $pwd 'dist\win-unpacked\Dawith Welfare Office.exe'
          if (-not (Test-Path $app)) { throw "Packaged app not found: $app" }
          $process = Start-Process -FilePath $app -ArgumentList '--disable-gpu' -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) { throw "Packaged app exited with code $($process.ExitCode)" }
            $listener = Get-NetTCPConnection -OwningProcess $process.Id -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalAddress -eq '127.0.0.1' }
            if (-not $listener) { throw 'Packaged app did not open a loopback listener' }
            Write-Host "Packaged app listening on $($listener.LocalPort)"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Smoke test NSIS installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem (Join-Path $pwd 'dist') -Filter '*-x64-Setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw 'NSIS installer not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'Dawith Welfare Office Installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer failed with code $($install.ExitCode)" }
          $installedApp = Join-Path $installDir 'Dawith Welfare Office.exe'
          if (-not (Test-Path $installedApp)) { throw "Installed app not found: $installedApp" }
          $process = Start-Process -FilePath $installedApp -ArgumentList '--disable-gpu' -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) { throw "Installed app exited with code $($process.ExitCode)" }
            $processIds = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq $installedApp } | Select-Object -ExpandProperty ProcessId)
            if (-not $processIds) { $processIds = @($process.Id) }
            $listener = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { ($processIds -contains $_.OwningProcess) -and ($_.LocalAddress -in @('127.0.0.1', '::1')) }
            if (-not $listener) { throw 'Installed app did not open a loopback listener' }
            Write-Host "Installed app listening on $($listener.LocalPort)"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dawith-welfare-office-windows
          path: dist/*
