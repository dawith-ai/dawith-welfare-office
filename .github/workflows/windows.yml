name: Build Dawith Welfare Office for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Browser regression test
        run: npm run test:e2e
      - name: Build Windows installers
        run: npm run dist:win
      - name: Smoke test packaged Windows app
        shell: pwsh
        run: |
          $app = Join-Path $pwd 'dist\win-unpacked\Dawith Welfare Office.exe'
          if (-not (Test-Path $app)) { throw "Packaged app not found: $app" }
          $userDataDir = Join-Path $env:RUNNER_TEMP 'dawith-welfare-office-packaged-data'
          $logFile = Join-Path $env:RUNNER_TEMP 'dawith-welfare-office-packaged.log'
          $process = Start-Process -FilePath $app -ArgumentList @('--disable-gpu', "--user-data-dir=$userDataDir", '--enable-logging=file', "--log-file=$logFile") -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              if (Test-Path $logFile) { Get-Content $logFile }
              throw "Packaged app exited with code $($process.ExitCode)"
            }
            $processTree = @(Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq $process.Id -or $_.ParentProcessId -eq $process.Id })
            $processIds = @($process.Id) + @($processTree | Select-Object -ExpandProperty ProcessId)
            $listener = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $processIds -contains $_.OwningProcess -and $_.LocalAddress -in @('127.0.0.1', '::1') }
            if (-not $listener) { throw 'Packaged app did not open a loopback listener' }
            $port = $listener | Select-Object -First 1 -ExpandProperty LocalPort
            $health = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -UseBasicParsing
            if ($health.StatusCode -ne 200) { throw "Packaged app health check returned $($health.StatusCode)" }
            Write-Host "Packaged app health OK on 127.0.0.1:$port"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Smoke test NSIS installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem (Join-Path $pwd 'dist') -Filter '*-x64-Setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw 'NSIS installer not found' }
          $installDir = Join-Path $env:RUNNER_TEMP 'dawith-welfare-office-installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer failed with code $($install.ExitCode)" }
          $installedApp = Join-Path $installDir 'Dawith Welfare Office.exe'
          if (-not (Test-Path $installedApp)) { throw "Installed app not found: $installedApp" }
          $userDataDir = Join-Path $env:RUNNER_TEMP 'dawith-welfare-office-installed-data'
          $logFile = Join-Path $env:RUNNER_TEMP 'dawith-welfare-office-installed.log'
          $process = Start-Process -FilePath $installedApp -ArgumentList @('--disable-gpu', "--user-data-dir=$userDataDir", '--enable-logging=file', "--log-file=$logFile") -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($process.HasExited) {
              if (Test-Path $logFile) { Get-Content $logFile }
              throw "Installed app exited with code $($process.ExitCode)"
            }
            $processTree = @(Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq $process.Id -or $_.ParentProcessId -eq $process.Id })
            $processIds = @($process.Id) + @($processTree | Select-Object -ExpandProperty ProcessId)
            $listener = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { ($processIds -contains $_.OwningProcess) -and ($_.LocalAddress -in @('127.0.0.1', '::1')) }
            if (-not $listener) { throw 'Installed app did not open a loopback listener' }
            $port = $listener | Select-Object -First 1 -ExpandProperty LocalPort
            $health = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -UseBasicParsing
            if ($health.StatusCode -ne 200) { throw "Installed app health check returned $($health.StatusCode)" }
            Write-Host "Installed app health OK on 127.0.0.1:$port"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dawith-welfare-office-windows
          path: dist/*
